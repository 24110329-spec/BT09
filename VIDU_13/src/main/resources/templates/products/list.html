<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><h1>Products</h1><form><input name="keyword" th:value="${keyword}"><button>Tìm</button></form><a th:href="@{/products/create}">Thêm Product</a><table><tr th:each="p:${products.content}"><td th:text="${p.id}"></td><td th:text="${p.name}"></td><td th:text="${p.price}"></td><td th:text="${p.username}"></td><td><a th:href="@{/products/edit/{id}(id=${p.id})}">Edit</a><form th:action="@{/products/delete/{id}(id=${p.id})}" method="post" style="display:inline"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button>Delete</button></form></td></tr></table></body></html>
