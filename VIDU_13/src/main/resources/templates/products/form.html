<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><h1 th:text="${mode}">Product</h1><form th:object="${productDTO}" th:with="actionUrl=${mode == 'create' ? '/products/create' : '/products/edit/' + productDTO.id}" th:action="${actionUrl}" method="post" enctype="multipart/form-data"><input th:field="*{name}"><textarea th:field="*{description}"></textarea><input type="number" step="0.01" th:field="*{price}"><input type="file" name="image" accept="image/*"><button>Lưu</button></form></body></html>
