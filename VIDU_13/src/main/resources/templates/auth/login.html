<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Login</title></head><body><h1>Đăng nhập</h1><p th:if="${param.error}">Sai username hoặc password</p><p th:if="${param.logout}">Đã đăng xuất</p><form th:action="@{/login}" method="post"><input name="username" placeholder="username" required><input type="password" name="password" required><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button>Login</button></form><a th:href="@{/register}">Đăng ký</a> | <a th:href="@{/forgot-password}">Quên mật khẩu</a></body></html>
