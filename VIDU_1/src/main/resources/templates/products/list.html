<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layouts/layout :: head('Danh sách sản phẩm')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="container">
    <div class="panel">
        <div class="page-title">
            <h2>📦 Danh sách Sản phẩm</h2>
            <a th:href="@{/products/add}" class="btn primary small">+ Thêm mới</a>
        </div>

        <div class="alert success" th:if="${success}" th:text="${success}"></div>
        <div class="alert error"   th:if="${error}"   th:text="${error}"></div>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th style="width:50px;">ID</th>
                    <th>Tên sản phẩm</th>
                    <th>Thương hiệu</th>
                    <th>Xuất xứ</th>
                    <th style="width:120px;">Giá (VNĐ)</th>
                    <th>Người quản lý</th>
                    <th style="width:150px; text-align:center;">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${productPage.content}">
                    <td th:text="${p.id}">1</td>
                    <td th:text="${p.name}">Sản phẩm A</td>
                    <td th:text="${p.brand != null ? p.brand : '---'}">Apple</td>
                    <td th:text="${p.madein != null ? p.madein : '---'}">USA</td>
                    <td th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')}">1,000,000</td>
                    <td>
                        <span th:if="${p.userFullName != null}" th:text="${p.userFullName}">Admin</span>
                        <span th:unless="${p.userFullName != null}" style="color:#94a3b8;">---</span>
                    </td>
                    <td style="text-align:center; white-space:nowrap;">
                        <a th:href="@{/products/edit/{id}(id=${p.id})}" class="btn secondary small">Sửa</a>
                        <form th:action="@{/products/delete/{id}(id=${p.id})}" method="post" style="display:inline;"
                              onsubmit="return confirm('Xóa sản phẩm này?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn danger small" type="submit">Xóa</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(productPage.content)}">
                    <td colspan="7" style="text-align:center; color:#94a3b8; padding:30px;">
                        Chưa có sản phẩm nào trong hệ thống.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="pagination" th:if="${totalPages > 1}">
            <a th:href="@{/products(page=0)}">&laquo;</a>
            <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
               th:href="@{/products(page=${i})}"
               th:text="${i + 1}"
               th:classappend="${i == currentPage} ? 'active' : ''">1</a>
            <a th:href="@{/products(page=${totalPages - 1})}">&raquo;</a>
        </div>

        <div style="margin-top: 20px;">
            <a th:href="@{/}" class="btn secondary small">← Trang chủ</a>
        </div>
    </div>
</main>

<footer class="footer">
    <p>© 2026 IOTSTAR SHOP – Quản lý Sản phẩm</p>
</footer>
</body>
</html>
