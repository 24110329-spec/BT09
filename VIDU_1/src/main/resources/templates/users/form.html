<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head(${isEdit} ? 'Sửa người dùng' : 'Thêm người dùng')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="container">
    <div class="panel" style="max-width: 600px; margin: 30px auto;">
        <div class="page-title">
            <h2 th:text="${isEdit} ? '✏️ Cập nhật người dùng' : '➕ Thêm người dùng mới'">Form người dùng</h2>
        </div>

        <div class="alert error" th:if="${error}" th:text="${error}"></div>

        <form th:action="${isEdit} ? @{/users/edit/{id}(id=${userForm.id})} : @{/users/add}"
              th:object="${userForm}"
              method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-group">
                <label>Email <span style="color: red;">*</span></label>
                <input type="email" th:field="*{email}"
                       th:readonly="${isEdit}"
                       th:style="${isEdit} ? 'background:#f8fafc; cursor:not-allowed;' : ''"
                       placeholder="Nhập địa chỉ email">
                <div style="color:#dc2626; font-size:13px; margin-top:4px;"
                     th:if="${#fields.hasErrors('email')}"
                     th:errors="*{email}">Lỗi email</div>
            </div>

            <div class="form-group">
                <label>Họ và tên <span style="color: red;">*</span></label>
                <input type="text" th:field="*{fullName}" placeholder="Nhập họ và tên">
                <div style="color:#dc2626; font-size:13px; margin-top:4px;"
                     th:if="${#fields.hasErrors('fullName')}"
                     th:errors="*{fullName}">Lỗi họ tên</div>
            </div>

            <div class="form-group">
                <label>Vai trò <span style="color: red;">*</span></label>
                <select name="roleId">
                    <option value="" disabled>-- Chọn vai trò --</option>
                    <option th:each="r : ${roles}"
                            th:value="${r.id}"
                            th:text="${r.name}"
                            th:selected="${userForm.role != null and userForm.role.id == r.id}">
                        ROLE
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label th:text="${isEdit} ? 'Mật khẩu mới (để trống nếu không đổi)' : 'Mật khẩu *'">Mật khẩu</label>
                <input type="password" name="rawPassword"
                       th:placeholder="${isEdit} ? 'Để trống nếu giữ nguyên' : 'Nhập mật khẩu (tối thiểu 6 ký tự)'">
            </div>

            <div class="form-group">
                <label style="display:flex; align-items:center; gap: 8px; cursor:pointer;">
                    <input type="checkbox" th:field="*{enabled}" style="width:16px; height:16px;">
                    Tài khoản đang hoạt động
                </label>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 20px;">
                <button class="btn primary" type="submit">
                    <span th:text="${isEdit} ? '💾 Lưu thay đổi' : '➕ Thêm mới'">Lưu</span>
                </button>
                <a th:href="@{/users}" class="btn secondary">Huỷ</a>
            </div>
        </form>
    </div>
</main>

<footer class="footer">
    <p>© 2026 IOTSTAR SHOP</p>
</footer>
</body>
</html>
