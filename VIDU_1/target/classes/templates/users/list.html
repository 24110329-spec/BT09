<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layouts/layout :: head('Quản lý người dùng')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="container">
    <div class="panel">
        <div class="page-title">
            <h2>Quản lý Người dùng</h2>
            <a th:href="@{/users/add}" class="btn primary small">+ Thêm mới</a>
        </div>

        <!-- Flash messages -->
        <div class="alert success" th:if="${success}" th:text="${success}"></div>
        <div class="alert error"   th:if="${error}"   th:text="${error}"></div>

        <!-- Search bar -->
        <form th:action="@{/users}" method="get" class="search-bar">
            <input type="text" name="keyword" placeholder="Tìm theo email hoặc tên..."
                   th:value="${keyword}">
            <button class="btn primary small" type="submit">Tìm kiếm</button>
            <a th:href="@{/users}" class="btn secondary small">Xóa bộ lọc</a>
        </form>

        <!-- Table -->
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th style="width:50px;">ID</th>
                    <th>Email</th>
                    <th>Họ và tên</th>
                    <th style="width:100px;">Vai trò</th>
                    <th style="width:90px;">Trạng thái</th>
                    <th style="width:180px; text-align:center;">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${userPage.content}">
                    <td th:text="${u.id}">1</td>
                    <td th:text="${u.email}">admin@email.com</td>
                    <td th:text="${u.fullName}">Admin</td>
                    <td>
                        <span class="badge"
                              th:style="${u.roleName == 'ADMIN'} ? 'background:#fee2e2;color:#991b1b;' : 'background:#dbeafe;color:#1e40af;'"
                              th:text="${u.roleName}">ADMIN</span>
                    </td>
                    <td>
                        <span th:if="${u.enabled}"   style="color:#16a34a; font-weight:600;">✔ Hoạt động</span>
                        <span th:unless="${u.enabled}" style="color:#dc2626; font-weight:600;">✘ Bị khóa</span>
                    </td>
                    <td style="text-align:center; white-space:nowrap;">
                        <a th:href="@{/users/edit/{id}(id=${u.id})}" class="btn secondary small">Sửa</a>

                        <form th:action="@{/users/toggle/{id}(id=${u.id})}" method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn small"
                                    th:text="${u.enabled} ? 'Khóa' : 'Mở khóa'"
                                    th:style="${u.enabled} ? 'background:#f59e0b;color:#fff;' : 'background:#16a34a;color:#fff;'"
                                    type="submit"></button>
                        </form>

                        <form th:action="@{/users/delete/{id}(id=${u.id})}" method="post" style="display:inline;"
                              onsubmit="return confirm('Bạn có chắc muốn xóa người dùng này?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn danger small" type="submit">Xóa</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(userPage.content)}">
                    <td colspan="6" style="text-align:center; color:#94a3b8; padding:30px;">
                        Không tìm thấy người dùng nào.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="pagination" th:if="${totalPages > 1}">
            <a th:href="@{/users(page=0, keyword=${keyword})}">&laquo;</a>
            <a th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
               th:href="@{/users(page=${i}, keyword=${keyword})}"
               th:text="${i + 1}"
               th:classappend="${i == currentPage} ? 'active' : ''">1</a>
            <a th:href="@{/users(page=${totalPages - 1}, keyword=${keyword})}">&raquo;</a>
        </div>

        <div style="margin-top: 20px;">
            <a th:href="@{/}" class="btn secondary small">← Trang chủ</a>
        </div>
    </div>
</main>

<footer class="footer">
    <p>© 2026 IOTSTAR SHOP – Quản lý người dùng</p>
</footer>
</body>
</html>
