<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="topbar">
    <div class="brand">
        <a th:href="@{/}">IOTSTAR SHOP</a>
    </div>

    <nav style="display: flex; gap: 10px; margin-left: 20px;">
        <a th:href="@{/}" style="color: #dbeafe; text-decoration: none; padding: 5px 10px;">🏠 Trang chủ</a>
        <a th:href="@{/products}" style="color: #dbeafe; text-decoration: none; padding: 5px 10px;">📦 Sản phẩm</a>
        <a th:href="@{/users}" sec:authorize="hasRole('ADMIN')" style="color: #dbeafe; text-decoration: none; padding: 5px 10px;">👥 Người dùng</a>
        <a th:href="@{/dashboard}" sec:authorize="hasRole('ADMIN')" style="color: #dbeafe; text-decoration: none; padding: 5px 10px;">🛡️ Dashboard</a>
    </nav>

    <div class="account" sec:authorize="isAuthenticated()" style="margin-left: auto; display: flex; align-items: center; gap: 12px;">
        <span style="color: #93c5fd;">Xin chào, </span>
        <span sec:authentication="name" style="font-weight: bold; color: #fff;">user</span>
        <span style="font-size: 12px; background: #1e40af; padding: 2px 8px; border-radius: 4px;" sec:authentication="principal.authorities">[ROLE_USER]</span>
        <form th:action="@{/logout}" method="post" style="display:inline; margin: 0;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="link-button" type="submit">Đăng xuất</button>
        </form>
    </div>

    <div class="account" sec:authorize="!isAuthenticated()" style="margin-left: auto;">
        <a th:href="@{/login}" class="btn primary small">Đăng nhập</a>
    </div>
</header>
</body>
</html>
