<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Đăng nhập')}"></head>
<body class="auth-page">
<div class="auth-card">
    <h1 style="text-align: center; margin-bottom: 5px;">IOTSTAR SHOP</h1>
    <h2 style="text-align: center; color: #64748b; font-size: 18px; margin-top: 0;">Đăng nhập hệ thống</h2>

    <div class="alert error" th:if="${param.error}">
        Email hoặc mật khẩu không đúng.
    </div>
    <div class="alert success" th:if="${param.verified}">
        Xác thực tài khoản thành công. Hãy đăng nhập.
    </div>
    <div class="alert success" th:if="${param.reset}">
        Đổi mật khẩu thành công.
    </div>
    <div class="alert success" th:if="${param.logout}">
        Bạn đã đăng xuất thành công khỏi hệ thống.
    </div>

    <form th:action="@{/login}" method="post">
        <label>Email</label>
        <input type="email" name="email" placeholder="Nhập email đăng nhập" required autofocus>

        <label style="margin-top: 14px;">Mật khẩu</label>
        <input type="password" name="password" placeholder="Nhập mật khẩu" required>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <button class="btn primary full" type="submit" style="margin-top: 20px;">Đăng nhập</button>
    </form>

    <div style="margin-top: 20px; font-size: 13px; color: #64748b; background: #f8fafc; padding: 10px; border-radius: 6px;">
        <p style="margin: 0 0 5px 0;"><strong>Tài khoản mẫu:</strong></p>
        <p style="margin: 0;">- Admin: <code>trungnh@hcmute.edu.vn</code> / <code>123456</code></p>
        <p style="margin: 0;">- User: <code>user@hcmute.edu.vn</code> / <code>123456</code></p>
    </div>

    <p style="text-align: center; margin-top: 20px; font-size: 14px;">
        <a th:href="@{/}">Quay lại Trang chủ</a>
    </p>
</div>
</body>
</html>
