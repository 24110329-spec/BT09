server.port=8080
spring.application.name=ex_1

# Thymeleaf configuration (Không dùng layout dialect theo yêu cầu Ví dụ 1)
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Kết nối CSDL MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ex_1?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# UTF-8 & Overriding
spring.main.allow-bean-definition-overriding=true

# Admin mặc định khởi tạo
ADMIN_EMAIL=thanhthao@hcmute.edu.vn
ADMIN_PASSWORD=123456
