<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{layouts/layout :: head('Đăng nhập')}"></head><body class="auth-page"><div class="auth-card"><h1>IOTSTAR SHOP</h1><h2>Đăng nhập</h2><div class="alert error" th:if="${param.error}">Username/email hoặc password không đúng.</div><div class="alert success" th:if="${param.logout}">Bạn đã đăng xuất.</div><form th:action="@{/login}" method="post"><label>Username hoặc Email</label><input type="text" name="username" placeholder="Username hoặc email" required autofocus><label>Mật khẩu</label><input type="password" name="password" required><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn primary full">Đăng nhập</button></form><p>Admin: <code>admin01 / 123456</code></p><p>User: <code>user01 / 123456</code> hoặc email.</p></div></body></html>
