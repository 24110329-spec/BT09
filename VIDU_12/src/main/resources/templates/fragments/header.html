<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body><header th:fragment="header" class="topbar"><div class="brand"><a th:href="@{/}">IOTSTAR SHOP</a></div><nav><a th:href="@{/}">🏠 Trang chủ</a><a th:href="@{/products}">📦 Sản phẩm</a><a th:href="@{/users}" sec:authorize="hasRole('ADMIN')">👥 Người dùng</a><a th:href="@{/dashboard}" sec:authorize="hasRole('ADMIN')">🛡️ Dashboard</a></nav><div class="account" sec:authorize="isAuthenticated"><img th:src="${#authentication.principal.images != null and !#strings.isEmpty(#authentication.principal.images) ? #authentication.principal.images : '/images/avatar-default.png'}" width="40" height="40" style="border-radius:50%;object-fit:cover"><span>Xin chào, <b th:text="${#authentication.principal.fullName}">User</b></span><span th:text="${#authentication.principal.username}">user01</span><span th:text="${#authentication.principal.email}">email</span><span th:text="${#authentication.principal.role}">ROLE_USER</span><form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="link-button">Đăng xuất</button></form></div><div sec:authorize="!isAuthenticated" class="account"><a th:href="@{/login}">Đăng nhập</a></div></header></body></html>
